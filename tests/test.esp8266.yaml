esphome:
  name: hcs12ss59t-test

esp8266:
  board: d1_mini

external_components:
  - source:
      type: local
      path: ../components

logger:

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13

time:
  - platform: sntp
    id: sntp_time

display:
  - platform: hcs12ss59t
    id: vfd_display
    cs_pin: GPIO15
    reset_pin: GPIO5
    vdon_pin: GPIO4
    intensity: 12
    lambda: |-
      it.strftime("%H:%M:%S", id(sntp_time).now());

wifi:
  ssid: test
  password: test12345
